[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-tuner"
version = "0.1.0"
description = "Noise- and Hardware-Aware Configuration Optimization for Quantum Graph Coloring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "QAOA-Tuner Team" }
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    # Tested baseline: Qiskit 2.2.3 and Qiskit Aer 0.17.2 (Python 3.13.9).
    # Upper bounds guard against API changes in newer minor releases.
    "qiskit>=2.2.3,<2.3",
    "qiskit-aer>=0.17.2,<0.18",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
